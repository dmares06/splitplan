services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: splitplan
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d splitplan"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/splitplan
      PORT: 4001
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:80"

  test-runner:
    build: ./backend
    profiles: [test]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/splitplan
    command: ["npm", "test"]

volumes:
  db-data:
